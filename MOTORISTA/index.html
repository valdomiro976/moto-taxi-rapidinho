<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5a623" />
    <title>Motorista · MOTO-TAXI RAPIDINHO</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="/compartilhado/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>MOTO&#8209;TAXI <span>RAPIDINHO</span></h1>
      <p class="tagline">Área do motorista — aceite corridas e ganhe.</p>
    </header>

    <main>
      <section id="auth" class="card hidden">
        <h2>Acesso do motorista</h2>
        <form id="auth-form" autocomplete="on">
          <label>
            Nome
            <input type="text" name="name" placeholder="Seu nome" />
          </label>
          <label>
            E-mail
            <input type="email" name="email" placeholder="voce@email.com" required />
          </label>
          <label>
            Senha
            <input type="password" name="password" placeholder="minimo 6 caracteres" required />
          </label>
          <div class="actions">
            <button type="submit" data-action="login">Entrar</button>
            <button type="button" data-action="register" class="secondary">Cadastrar</button>
          </div>
        </form>
        <p id="auth-status" class="status" role="status"></p>
      </section>

      <section id="workspace" class="hidden">
        <div class="card session-bar">
          <span id="current-user"></span>
          <button type="button" id="logout" class="ghost">Sair</button>
        </div>
        <div id="module-container" class="card"></div>
      </section>
    </main>

    <footer>
      <small>MOTO-TAXI RAPIDINHO &middot; motorista</small>
    </footer>

    <script src="/compartilhado/js/api.js"></script>
    <script src="/compartilhado/js/ui.js"></script>
    <script src="js/motorista.js"></script>
    <script src="/compartilhado/js/shell.js"></script>
    <script>
      // Prefixo proprio: a sessao do motorista nao colide com a do passageiro.
      startApp({
        api: createApi('motoTaxiDriver'),
        module: DriverModule,
        role: 'driver',
      });
    </script>
  </body>
</html>
